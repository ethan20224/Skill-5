<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Nine template · Sip</title>
<!--
  LEVEL NINE STARTER — a complete, working state sheet to copy and replace.
  This is the GLANCE structure: one fact, read in a second. A screen whose job is to
  browse, enter, scroll, explore or talk starts from assets/archetypes.html instead
  (anatomy.md §1: pick the structure from the job).

  The example is "Sip", a water tracker, built with the method:
    Default refused : water apps are blue gradients with a ring chart.
    Ground          : mustard (warm, kitchen-table daylight); ink is deep brown.
    Accent          : the WATER is the only cool colour — the accent lives where the state is.
    Hero (P1)       : a glass drawn at the real fill level (ml / goal), ml ruler on the side.
    Moments (P7)    : 08:10 barely started · 14:30 on pace · 21:40 goal met.
    Signature (P8)  : hold to log 250 ml — the button fills, the water rises, haptic tick.
    Detail (P3)     : coaster, rim highlight, rising bubbles, a lemon slice when the goal is met.

  It passes the Works gate, and yours must too (SKILL.md §2):
    Sizes           : the screen is var(--device-w) × var(--device-h); the hero flexes, nothing
                      is placed by fixed pixels. The audit forces 375 × 667 and 440 × 956.
    Large text      : hero and copy share one scroll area; the action and the tab bar stay put.
    Long content    : stats sit on a wrapping row, so a longer value moves instead of breaking.
    Dark            : a second set of tokens under prefers-color-scheme: dark, designed, not inverted.
    Presses         : every control has a pressed state; the signature carries data-interaction.

  Replace: tokens (:root, both appearances), STATES (content), heroSVG() (your hero), copy, tab names.
  Keep: the slots, :where() resets, the interaction helpers, data-screen on each screen.
  Audit: node ~/.claude/skills/skill-5/scripts/audit.mjs template.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens: name by ROLE, never by colour ---------- */
  :root {
    --ground: #E8B04B;   /* screen background */
    --tone-1: #D49A35;   /* shadows, far planes, tab bar */
    --tone-2: #B27A22;   /* mid shapes */
    --light:  #F7DC9C;   /* highlights, glass */
    --line:   #5C3C0E;   /* outlines and lettering in the picture */
    --ink:    #2B1C06;   /* text, icons */
    --ink-2:  #4A3510;   /* secondary text (contrast-checked, NOT opacity) */
    --accent: #2C7C8C;   /* the water: where the state lives */
    --accent-light: #8CCAD2;
    --on-accent: #FFF6E2;
    --pill: #FFF6E2; --pill-ink: #2B1C06;
    --page: #E9E2D2; --caption: #6B5A3A; --bezel: #17120A;   /* the sheet around the phones */
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --text: 'Hanken Grotesk', system-ui, sans-serif;
    --ease-out: cubic-bezier(.23,1,.32,1);
    --ease-move: cubic-bezier(.77,0,.175,1);
    --ease-drawer: cubic-bezier(.32,.72,0,1);
    --radius-pill: 27px; --radius-btn: 22px;   /* the stated radius scale */
  }
  /* dark is a second design: the ground goes to night, the water stays the only cool colour */
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #22170A; --tone-1: #191006; --tone-2: #3B2A11; --light: #5E461D; --line: #DDB971;
      --ink: #F7E9C8; --ink-2: #D2BC8E;
      --accent: #3A9AAB; --accent-light: #8FD0D9; --on-accent: #0E1F23;
      --pill: #F7E9C8; --pill-ink: #22170A;
      --page: #120D06; --caption: #A8946A; --bezel: #2C2214;
    }
  }

  /* ---------- resets with ZERO specificity so components always win ---------- */
  :where(*, *::before, *::after) { box-sizing: border-box; }
  :where(button) { all: unset; box-sizing: border-box; cursor: pointer; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }   /* all: unset drops box-sizing too */
  :where(h1, h2, p) { margin: 0; }

  body { margin: 0; min-height: 100dvh; background: var(--page); font-family: var(--text); color: var(--ink);
         -webkit-font-smoothing: antialiased; display: flex; flex-wrap: wrap; gap: 48px; justify-content: center; align-items: flex-start; padding: 48px 24px; }
  .tab { font-variant-numeric: tabular-nums; }

  /* ---------- device frame + screen (the audit finds [data-screen] and sets the two sizes) ---------- */
  .moment { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .moment > figcaption { font: 600 13px/1 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--caption); }
  .device { padding: 12px; border-radius: 64px; background: var(--bezel); box-shadow: 0 30px 60px -24px rgb(40 28 6 / .55); }
  .screen { position: relative; width: var(--device-w, 390px); height: var(--device-h, 844px); border-radius: 52px; overflow: hidden; background: var(--ground);
            display: flex; flex-direction: column; container-type: size; }
  .island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 5; }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 5; }

  /* ---------- the glance slots (anatomy.md §1) ---------- */
  .status { height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 40px; font: 600 17px/1 var(--text); }
  .meta { height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px 0 24px; font: 600 13px/1.25 var(--text); }
  .meta span span { color: var(--ink-2); font-weight: 500; }
  .iconbtn { width: 44px; height: 44px; flex-shrink: 0; border-radius: var(--radius-btn); background: color-mix(in srgb, var(--ink) 10%, transparent); display: grid; place-items: center; }
  /* hero + copy scroll together when the text is large; at the drawn size nothing scrolls */
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; }
  .hero { position: relative; flex: 1 1 330px; min-height: 150px; }
  .hero svg { display: block; width: 100%; height: 100%; }
  .copy { flex: 0 0 auto; display: flex; flex-direction: column; padding: 10px 24px 4px; }
  .cap { font: 700 11px/1 var(--text); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  .display { font-family: var(--display); font-variation-settings: "wdth" 80; font-weight: 800; font-size: 92px; line-height: .92; letter-spacing: -.015em; margin-top: 8px; white-space: nowrap; }
  .display small { font-size: 34px; letter-spacing: -.02em; margin-left: 4px; }
  .lede { margin-top: 14px; font-size: 15px; line-height: 1.42; font-weight: 500; max-width: 32ch; }
  /* a wrapping row, not a rigid grid: a longer value takes the room it needs and the next stat moves down */
  .stats { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
  .stats > div { flex: 1 1 96px; min-width: max-content; }
  .stats div div:first-child { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .stats div div:last-child { font: 800 22px/1.15 var(--display); letter-spacing: -.02em; margin-top: 3px; white-space: nowrap; }
  .actions { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 12px 24px 0; }
  .pill { position: relative; flex: 1; min-width: 0; height: 54px; border-radius: var(--radius-pill); background: var(--pill); color: var(--pill-ink);
          font: 700 16px/1 var(--text); display: flex; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }
  .pill .label { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .ghost { height: 54px; padding: 0 18px; display: flex; align-items: center; font: 700 15px/1 var(--text); white-space: nowrap; }
  .tabbar { height: 84px; flex-shrink: 0; margin-top: 14px; background: var(--tone-1); display: flex; padding: 9px 12px 0; }
  .tabbtn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 10px/1.2 var(--text); color: color-mix(in srgb, var(--ink) 80%, transparent); }
  .tabbtn.on { color: var(--ink); }
  /* a short phone gets a smaller display moment before it gets a scroll bar */
  @container (max-height: 700px) { .display { font-size: 72px; } .lede { margin-top: 10px; } .hero text { font-size: 21px; } }   /* the picture shrinks; its lettering must not */

  /* ---------- interactions (interaction.md) ---------- */
  .press { transition: transform 140ms var(--ease-out); }
  .press:active { transform: scale(.97); }
  /* the fill carries the same label in the other colour, so the wipe never garbles the words */
  .pill .fill { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--accent); color: var(--on-accent);
                clip-path: inset(0 100% 0 0 round var(--radius-pill)); transition: clip-path 200ms var(--ease-out); }
  .pill.holding .fill { clip-path: inset(0 0 0 0 round var(--radius-pill)); transition: clip-path 1100ms linear; }
  .water { transition: transform 900ms cubic-bezier(.34,1.32,.64,1); }   /* fill-as-you-add: slight overshoot */
  .bubble { animation: rise 3.2s linear infinite; }
  .bubble:nth-child(2) { animation-delay: 1.1s; } .bubble:nth-child(3) { animation-delay: 2.2s; }
  @keyframes rise { from { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } to { transform: translateY(-150px); opacity: 0; } }
  .enter { animation: enter 460ms var(--ease-out) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .bubble, .enter { animation: none; } .water { transition: none; } }
</style>
</head>
<body>

<script>
/* ---------- content first (copy-and-data.md): every word and number ---------- */
const GOAL = 2000;
const STATES = [
  { id: 'morning',   clock: '8:10',  meta: 'Tue 4 Nov', sub: 'day 23 of your streak', ml: 250,
    cap: 'Today so far', lede: 'Start with a glass before coffee. You sleep better on the days you front-load.',
    stats: [['Glasses', '1'], ['Last', '7:52'], ['Pace', 'Behind']], primary: 'Hold to log 250 ml', secondary: 'Undo' },
  { id: 'afternoon', clock: '14:30', meta: 'Tue 4 Nov', sub: 'day 23 of your streak', ml: 1250,
    cap: 'On pace', lede: 'Two more glasses before your 16:00 run. The cold tap in the kitchen is fine.',
    stats: [['Glasses', '5'], ['Last', '13:52'], ['Run at', '16:00']], primary: 'Hold to log 250 ml', secondary: 'Undo' },
  { id: 'night',     clock: '21:40', meta: 'Tue 4 Nov', sub: 'day 23, kept', ml: 2000,
    cap: 'Goal met', lede: 'Stop here. Anything more and you will be up at 3 am. See you at breakfast.',
    stats: [['Glasses', '8'], ['Streak', '23 days'], ['Best', '31 days']], primary: 'Share day 23', secondary: 'History' },
];

/* ---------- the hero object, bound to data (hero-objects.md §6) ---------- */
const TOP = 46, BOTTOM = 282, H = BOTTOM - TOP;                    // inner glass height, in the picture's own units
const waterShift = (ml) => (H * (1 - Math.min(1, ml / GOAL))).toFixed(1);   // how far down the water sits
function heroSVG(s) {
  const top = TOP, bottom = BOTTOM;
  const ticks = [500, 1000, 1500, 2000].map(v => {
    const y = bottom - H * (v / GOAL);
    return `<line x1="276" y1="${y}" x2="290" y2="${y}" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round"/>
            <text x="298" y="${y + 4}" font-family="Hanken Grotesk" font-weight="700" font-size="12" fill="var(--line)">${v === 2000 ? '2 L' : v}</text>`;
  }).join('');
  const lemon = s.ml >= GOAL ? `<g transform="translate(232 52) rotate(18)"><circle r="26" fill="#F2D24B"/><circle r="21" fill="#FBE98A"/>
      ${[0,60,120,180,240,300].map(a => `<line x1="0" y1="0" x2="${(19*Math.sin(a*Math.PI/180)).toFixed(1)}" y2="${(-19*Math.cos(a*Math.PI/180)).toFixed(1)}" stroke="#F2D24B" stroke-width="2"/>`).join('')}</g>` : '';
  return `
  <svg viewBox="0 0 390 330" aria-label="Glass ${s.ml} of ${GOAL} millilitres" role="img">
    <defs><clipPath id="glass-${s.id}"><path d="M120 ${top} L270 ${top} L254 ${bottom} Q195 ${bottom + 10} 136 ${bottom} Z"/></clipPath></defs>
    <ellipse cx="207" cy="300" rx="112" ry="16" fill="var(--tone-1)"/>                       <!-- poster offset shadow -->
    <ellipse cx="195" cy="294" rx="104" ry="14" fill="var(--tone-2)"/>                       <!-- coaster -->
    <path d="M120 ${top} L270 ${top} L254 ${bottom} Q195 ${bottom + 10} 136 ${bottom} Z" fill="var(--light)" fill-opacity=".55"/>
    <g clip-path="url(#glass-${s.id})">
      <g class="water" style="transform: translateY(${waterShift(s.ml)}px)">
        <rect x="100" y="${top}" width="190" height="${H + 20}" fill="var(--accent)"/>
        <ellipse cx="195" cy="${top}" rx="78" ry="7" fill="var(--accent-light)"/>
        <g fill="var(--accent-light)" opacity=".9"><circle class="bubble" cx="168" cy="${bottom - 14}" r="3.5"/><circle class="bubble" cx="214" cy="${bottom - 10}" r="2.5"/><circle class="bubble" cx="190" cy="${bottom - 18}" r="3"/></g>
      </g>
      <path d="M138 ${top} L152 ${top} L146 ${bottom - 6} L141 ${bottom - 8} Z" fill="#fff" opacity=".28"/>   <!-- glass highlight -->
    </g>
    <path d="M120 ${top} L270 ${top} L254 ${bottom} Q195 ${bottom + 10} 136 ${bottom} Z" fill="none" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/>
    <line x1="116" y1="${top}" x2="274" y2="${top}" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/>
    ${ticks}
    ${lemon}
  </svg>`;
}

/* ---------- custom stroke icons, one weight ---------- */
const I = {
  today: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l-1.5 17.5a1.5 1.5 0 0 1-1.5 1.5h-4a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M7.6 10h8.8"/></svg>',
  history: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  remind: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
  you: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  status: '<svg width="78" height="13" viewBox="0 0 78 13" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="4.8" y="6" width="3.2" height="6" rx="1"/><rect x="9.6" y="3.5" width="3.2" height="8.5" rx="1"/><rect x="14.4" y="1" width="3.2" height="11" rx="1"/><path d="M30 3.6a9.5 9.5 0 0 1 13 0l-1.4 1.5a7.4 7.4 0 0 0-10.2 0zM32.4 6.2a6 6 0 0 1 8.2 0l-1.5 1.5a3.9 3.9 0 0 0-5.2 0zM34.9 8.8a2.4 2.4 0 0 1 3.2 0l-1.6 1.7z"/><rect x="51" y="1" width="23" height="11" rx="3.4" fill="none" stroke="currentColor" stroke-opacity=".5"/><rect x="53" y="3" width="17" height="7" rx="1.8"/></svg>',
  ring: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="9" r="7.5" stroke-opacity=".35"/><path d="M9 1.5a7.5 7.5 0 0 1 7.5 7.5" stroke-linecap="round"/><circle cx="9" cy="9" r="2.4" fill="currentColor" stroke="none"/></svg>',
};

const fmt = (n) => n.toLocaleString('en-GB');

/* ---------- one screen = the glance slots, filled from a state ---------- */
function screen(s) {
  const done = s.ml >= GOAL;
  const label = `<span class="label">${I.ring}${s.primary}</span>`;
  return `
  <figure class="moment" style="margin:0">
    <div class="device"><section class="screen" data-screen="${s.id}" data-role="home" data-archetype="glance">
      <div class="island"></div>
      <div class="status"><span class="tab">${s.clock}</span>${I.status}</div>
      <div class="meta"><span>${s.meta} <span>· ${s.sub}</span></span>
        <button class="iconbtn press" aria-label="More"><svg width="16" height="4" viewBox="0 0 16 4" fill="currentColor"><circle cx="2" cy="2" r="1.8"/><circle cx="8" cy="2" r="1.8"/><circle cx="14" cy="2" r="1.8"/></svg></button></div>
      <div class="body">
        <div class="hero enter">${heroSVG(s)}</div>
        <div class="copy">
          <div class="cap">${s.cap}</div>
          <div class="display tab"><span class="ml">${fmt(s.ml)}</span><small>ml</small></div>
          <p class="lede">${s.lede}</p>
          <div class="stats">${s.stats.map(([k, v]) => `<div><div>${k}</div><div class="tab">${v}</div></div>`).join('')}</div>
        </div>
      </div>
      <div class="actions">
        ${done ? `<button class="pill press"><span class="label">${s.primary}</span></button>`
               : `<button class="pill press" data-hold data-interaction="hold:1100" aria-label="${s.primary}">${label}<span class="fill" aria-hidden="true">${label}</span></button>`}
        <button class="ghost press">${s.secondary}</button>
      </div>
      <nav class="tabbar">
        <button class="tabbtn on press">${I.today}Today</button><button class="tabbtn press">${I.history}History</button>
        <button class="tabbtn press">${I.remind}Reminders</button><button class="tabbtn press">${I.you}You</button>
      </nav>
      <div class="home"></div>
    </section></div>
    <figcaption>${s.clock} · ${s.cap}</figcaption>
  </figure>`;
}

document.body.innerHTML = STATES.map(screen).join('');

/* ---------- signature: hold to log, water rises (interaction.md) ---------- */
document.querySelectorAll('[data-hold]').forEach((btn) => {
  const scr = btn.closest('.screen');
  const s = STATES.find((x) => x.id === scr.dataset.screen);
  let t;
  const cancel = () => { clearTimeout(t); btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', () => {
    btn.classList.add('holding');
    t = setTimeout(() => {
      btn.classList.remove('holding');
      s.ml = Math.min(GOAL, s.ml + 250);
      scr.querySelector('.water').style.transform = `translateY(${waterShift(s.ml)}px)`;
      scr.querySelector('.ml').textContent = fmt(s.ml);
      navigator.vibrate?.([8, 40, 14]);
    }, 1100);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((e) => btn.addEventListener(e, cancel));
});
</script>
</body>
</html>
