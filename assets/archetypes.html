<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Nine archetypes · five structures that are not the glance</title>
<!--
  LEVEL NINE ARCHETYPES — working structures for the screens that are not a glance.
  (The glance, one fact read in a second, is assets/template.html.)

  Pick the structure from what the person does on the screen (anatomy.md §1):
    LIST          browse many things and open one        the content is the picture; the title leads
    FEED          scroll through new things              each item is whole; the newest leads
    INSTRUMENT    set or measure one value               the control is the hero; the action is pinned
    CANVAS        explore a map, a photo, a document     the subject fills the screen; chrome floats
    CONVERSATION  talk back and forth                    the latest message leads; the composer is pinned

  These are BLUEPRINTS. The greys and the system typeface are placeholders, chosen so that
  nothing here can be mistaken for a direction: a screen shipped in them is unfinished.
  Take the structure — what scrolls, what is pinned, what leads, where the thumb lands —
  and bring your own ground, type, hand, accent and content (SKILL.md Step 5).

  Every screen passes the Works gate as it stands (sizes, dark, long content, large text,
  presses), and yours must too. What makes that true, and must survive your redesign:
    - the screen is var(--device-w) × var(--device-h) and nothing inside is placed by fixed pixels
    - one region scrolls (.scroll); the bars and the primary action never leave the screen
    - text wraps instead of truncating; rows grow with their text
    - every control is 44 wide or more and gives something back when pressed
    - a second set of tokens under prefers-color-scheme: dark
  Audit: node ~/.claude/skills/skill-5/scripts/audit.mjs archetypes.html
-->
<style>
  /* ---------- placeholder tokens, named by ROLE. Replace every value. ---------- */
  :root {
    --ground: #F4F3F0; --surface: #FFFFFF; --fill: #E7E6E2; --line: #D3D2CD;
    --ink: #1A1A18; --ink-2: #5A5955;
    --pill: #1A1A18; --pill-ink: #F4F3F0;
    --page: #DEDDD8; --caption: #55544F; --bezel: #111110;
    --text: -apple-system, "SF Pro Text", system-ui, sans-serif;
    --ease-out: cubic-bezier(.23,1,.32,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #151514; --surface: #1F1F1D; --fill: #2B2B28; --line: #3D3D39;
      --ink: #F2F1EC; --ink-2: #B4B3AD;
      --pill: #F2F1EC; --pill-ink: #151514;
      --page: #0B0B0A; --caption: #A3A29C; --bezel: #2A2A27;
    }
  }

  /* ---------- resets with ZERO specificity so components always win ---------- */
  :where(*, *::before, *::after) { box-sizing: border-box; }
  :where(button) { all: unset; box-sizing: border-box; cursor: pointer; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }   /* all: unset drops box-sizing too */
  :where(h1, h2, p, figure) { margin: 0; }

  body { margin: 0; min-height: 100dvh; background: var(--page); font-family: var(--text); color: var(--ink); -webkit-font-smoothing: antialiased;
         display: flex; flex-wrap: wrap; gap: 48px; justify-content: center; align-items: flex-start; padding: 48px 24px; }
  .tab { font-variant-numeric: tabular-nums; }

  /* ---------- frame ---------- */
  .board { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .board > figcaption { max-width: 390px; font: 500 13px/1.4 var(--text); color: var(--caption); text-align: center; }
  .board > figcaption b { display: block; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .device { padding: 12px; border-radius: 64px; background: var(--bezel); }
  .screen { position: relative; width: var(--device-w, 390px); height: var(--device-h, 844px); border-radius: 52px; overflow: hidden;
            background: var(--ground); display: flex; flex-direction: column; }
  .island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 6; }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 6; }
  .status { height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 40px; font: 600 17px/1 var(--text); position: relative; z-index: 3; }

  /* ---------- shared parts ---------- */
  .scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }           /* the one region that moves */
  .nav { min-height: 44px; flex-shrink: 0; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 0 10px; }
  .nav .mid { text-align: center; font: 600 17px/1.2 var(--text); }
  .nav .mid small { display: block; font: 500 13px/1.3 var(--text); color: var(--ink-2); }
  .iconbtn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; transition: background-color 140ms ease, transform 140ms var(--ease-out); }
  .iconbtn:active { background: var(--fill); transform: scale(.94); }
  .cap { font: 600 13px/1.2 var(--text); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .pill { min-height: 54px; padding: 8px 20px; border-radius: 27px; background: var(--pill); color: var(--pill-ink); font: 600 17px/1.2 var(--text);
          display: flex; align-items: center; justify-content: center; text-align: center; transition: transform 140ms var(--ease-out); }
  .pill:active { transform: scale(.97); }
  .ghost { min-height: 54px; min-width: 44px; padding: 8px 16px; display: flex; align-items: center; justify-content: center; font: 600 16px/1.2 var(--text); transition: opacity 140ms ease; }
  .ghost:active { opacity: .5; }
  .tabbar { flex-shrink: 0; min-height: 84px; display: flex; padding: 8px 12px 30px; background: var(--surface); border-top: 1px solid var(--line); }
  .tabbtn { flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 10px/1.2 var(--text); color: var(--ink-2); transition: transform 140ms var(--ease-out); }
  .tabbtn.on { color: var(--ink); }
  .tabbtn:active { transform: scale(.94); }
  .slot { display: block; width: 100%; height: 100%; }                                    /* a picture goes here: yours, never a grey box */

  /* ---------- LIST ---------- */
  .ltitle { padding: 2px 24px 0; font: 700 34px/1.1 var(--text); letter-spacing: -.02em; }
  .search { margin: 12px 16px 4px; min-height: 44px; padding: 8px 14px; border-radius: 14px; background: var(--fill); display: flex; align-items: center; gap: 8px; font: 400 17px/1.2 var(--text); color: var(--ink-2); transition: opacity 140ms ease; }
  .search:active { opacity: .6; }
  .lhead { padding: 22px 24px 8px; }
  .row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 10px 16px 10px 24px; transition: background-color 120ms ease; }
  .row:active { background: var(--fill); }
  .row + .row { border-top: 1px solid var(--line); }
  .thumb { width: 44px; height: 58px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: var(--fill); }
  .row .words { flex: 1; min-width: 0; }
  .row .t { font: 600 17px/1.25 var(--text); }
  .row .s { margin-top: 2px; font: 400 15px/1.3 var(--text); color: var(--ink-2); }
  .row .m { flex-shrink: 0; font: 500 15px/1.2 var(--text); color: var(--ink-2); white-space: nowrap; }

  /* ---------- FEED ---------- */
  .post { padding: 16px 16px 8px; }
  .post + .post { border-top: 8px solid var(--fill); }
  .who { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .avatar { width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: var(--fill); display: grid; place-items: center; font: 600 15px/1 var(--text); color: var(--ink-2); }
  .who .n { font: 600 15px/1.25 var(--text); }
  .who .w { font: 400 13px/1.3 var(--text); color: var(--ink-2); }
  .media { margin-top: 12px; aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; background: var(--fill); }
  .said { margin-top: 12px; padding: 0 8px; font: 400 17px/1.4 var(--text); }
  .react { display: flex; align-items: center; gap: 2px; margin-top: 4px; font: 500 13px/1 var(--text); color: var(--ink-2); }
  .react span { margin-right: 12px; }

  /* ---------- INSTRUMENT ---------- */
  .ask { padding: 14px 24px 0; }
  .ask h1 { font: 700 28px/1.12 var(--text); letter-spacing: -.02em; }
  .ask p { margin-top: 8px; font: 400 15px/1.4 var(--text); color: var(--ink-2); }
  .bench { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: space-evenly; gap: 18px; padding: 18px 0; }   /* value + control, then its options, spread through what is left */
  .bench > div { display: flex; flex-direction: column; }
  .readout { padding: 0 24px; text-align: center; }
  .readout .v { margin-top: 6px; font: 700 72px/1 var(--text); letter-spacing: -.03em; white-space: nowrap; }
  .readout .v small { font-size: 28px; letter-spacing: 0; margin: 0 6px 0 2px; }
  .ruler { position: relative; height: 92px; margin-top: 18px; overflow: hidden; touch-action: none; cursor: ew-resize;
           -webkit-mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent); mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent); }
  .ruler:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .ruler svg { position: absolute; left: 50%; top: 0; height: 92px; overflow: visible; transition: transform 120ms var(--ease-out); }
  .ruler.dragging svg { transition: none; }
  .needle { position: absolute; left: 50%; top: 0; width: 3px; height: 54px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
  .seg { position: relative; align-self: center; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 12px; background: var(--fill); }
  .seg button { min-height: 36px; min-width: 120px; padding: 4px 14px; border-radius: 9px; display: grid; place-items: center; font: 500 15px/1.2 var(--text); color: var(--ink-2); transition: opacity 140ms ease; }
  .seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; }
  .seg button:active { opacity: .55; }
  .hint { margin-top: 14px; padding: 0 24px; text-align: center; font: 400 15px/1.4 var(--text); color: var(--ink-2); }
  .foot { flex-shrink: 0; display: flex; flex-direction: column; padding: 8px 24px 40px; }   /* pinned: thumb reach */

  /* ---------- CANVAS ---------- */
  .map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .over { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 2px 12px 0 16px; }
  .chip { flex: 1; min-width: 0; min-height: 48px; padding: 8px 16px; border-radius: 24px; background: var(--surface); box-shadow: 0 6px 18px -8px rgb(0 0 0 / .35);
          display: flex; align-items: center; gap: 10px; font: 400 17px/1.2 var(--text); color: var(--ink-2); transition: transform 140ms var(--ease-out); }
  .chip:active { transform: scale(.98); }
  .round { width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; background: var(--surface); box-shadow: 0 6px 18px -8px rgb(0 0 0 / .35); display: grid; place-items: center; transition: transform 140ms var(--ease-out); }
  .round:active { transform: scale(.94); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 8px 24px 40px; border-radius: 28px 28px 0 0; background: var(--surface); box-shadow: 0 -10px 30px -18px rgb(0 0 0 / .4); }
  .grab { width: 36px; height: 5px; margin: 0 auto 14px; border-radius: 3px; background: var(--line); }
  .sheet h1 { font: 700 28px/1.12 var(--text); letter-spacing: -.02em; }
  .sheet p { margin-top: 6px; font: 400 15px/1.4 var(--text); color: var(--ink-2); }
  .sheet .go { display: flex; align-items: center; gap: 6px; margin-top: 16px; }
  .sheet .go .pill { flex: 1; }

  /* ---------- CONVERSATION ---------- */
  .talk { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 8px; }
  .talk > :first-child { margin-top: auto; }                                              /* short threads sit at the bottom, long ones scroll */
  .day { align-self: center; padding: 6px 0; font: 500 12px/1.2 var(--text); color: var(--ink-2); }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 20px; font: 400 17px/1.35 var(--text); overflow-wrap: anywhere; }
  .msg.in { align-self: flex-start; background: var(--fill); border-bottom-left-radius: 6px; }
  .msg.out { align-self: flex-end; background: var(--ink); color: var(--ground); border-bottom-right-radius: 6px; }
  .offers { flex-shrink: 0; display: flex; gap: 8px; padding: 6px 16px; overflow-x: auto; scrollbar-width: none; }
  .offer { flex-shrink: 0; min-height: 36px; min-width: 44px; padding: 6px 14px; border-radius: 18px; border: 1px solid var(--line); display: flex; align-items: center; font: 500 15px/1.2 var(--text); white-space: nowrap; transition: background-color 140ms ease; }
  .offer:active { background: var(--fill); }
  .composer { flex-shrink: 0; display: flex; align-items: flex-end; gap: 8px; padding: 6px 12px 40px 16px; }
  .field { flex: 1; min-width: 0; min-height: 44px; padding: 10px 16px; border-radius: 22px; background: var(--fill); display: flex; align-items: center; font: 400 17px/1.3 var(--text); color: var(--ink-2); transition: opacity 140ms ease; }
  .field:active { opacity: .6; }
  .send { width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: var(--pill); color: var(--pill-ink); display: grid; place-items: center; transition: transform 140ms var(--ease-out); }
  .send:active { transform: scale(.92); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="var(--fill)"/><rect width="1.5" height="10" fill="var(--line)"/></pattern>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5 8 12l6.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20S4 15 4 9.3A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 8 2.3C20 15 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-say" viewBox="0 0 24 24"><path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 17h-7l-5 4v-4H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-here" viewBox="0 0 24 24"><path d="M20 4 4 11l7 2 2 7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-call" viewBox="0 0 24 24"><path d="M6 4h3l1.5 4.5-2 1.5a12 12 0 0 0 5.5 5.5l1.5-2L20 15v3a2 2 0 0 1-2 2A14 14 0 0 1 4 6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V6M6.5 11 12 5.5 17.5 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-status" viewBox="0 0 78 13"><g fill="currentColor"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="4.8" y="6" width="3.2" height="6" rx="1"/><rect x="9.6" y="3.5" width="3.2" height="8.5" rx="1"/><rect x="14.4" y="1" width="3.2" height="11" rx="1"/><path d="M30 3.6a9.5 9.5 0 0 1 13 0l-1.4 1.5a7.4 7.4 0 0 0-10.2 0zM32.4 6.2a6 6 0 0 1 8.2 0l-1.5 1.5a3.9 3.9 0 0 0-5.2 0zM34.9 8.8a2.4 2.4 0 0 1 3.2 0l-1.6 1.7z"/><rect x="53" y="3" width="17" height="7" rx="1.8"/></g><rect x="51" y="1" width="23" height="11" rx="3.4" fill="none" stroke="currentColor" stroke-opacity=".5"/></symbol>
  </defs>
</svg>

<!-- ====================== LIST: browse many, open one ====================== -->
<figure class="board">
  <div class="device"><section class="screen" data-screen="list" data-role="utility" data-archetype="list">
    <div class="island"></div>

  <figcaption><b>List</b>Browse many, open one. The title leads at native size, the rows are the picture, one thumbnail crop for all. Rows scroll; bars stay. No hero, no giant number, no stat row.</figcaption>

<!-- ====================== FEED: scroll through what is new ====================== -->
<figure class="board">
  <div class="device"><section class="screen" data-screen="feed" data-role="utility" data-archetype="feed">
    <div class="island"></div>
    <div class="status"><span class="tab">08:21</span><svg width="78" height="13" aria-hidden="true"><use href="#i-status"/></svg></div>
    <div class="nav"><span></span><div class="mid">Friends reading</div><button class="iconbtn" aria-label="Find a friend"><svg width="24" height="24" aria-hidden="true"><use href="#i-find"/></svg></button></div>

<script>
/* ---------- the instrument, working: drag the ruler, or use the arrow keys ---------- */
(() => {
  const PX = 12, STEP = 10, MIN = 240, MAX = 660;                     // 12 px per 10 minutes, 4 h to 11 h
  const ruler = document.getElementById('sleep-ruler'), ticks = document.getElementById('sleep-ticks');
  const out = document.getElementById('sleep-value'), hint = document.getElementById('sleep-hint');
  let value = 450, startX = 0, startValue = 0, dragging = false;
  let marks = '';
  for (let m = MIN; m <= MAX; m += STEP) {
    const x = (m - MIN) / STEP * PX, hour = m % 60 === 0, half = m % 30 === 0;
    marks += `<line x1="${x}" x2="${x}" y1="0" y2="${hour ? 40 : half ? 28 : 18}" stroke="var(${hour ? '--ink' : '--ink-2'})" stroke-width="${hour ? 2 : 1.4}" stroke-linecap="round"/>`;
    if (hour) marks += `<text x="${x}" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink-2)">${m / 60} h</text>`;
  }
  ticks.setAttribute('width', (MAX - MIN) / STEP * PX); ticks.setAttribute('height', 92);
  ticks.innerHTML = marks;
  const two = (n) => String(n).padStart(2, '0');
  const clock = (mins) => { mins = ((mins % 1440) + 1440) % 1440; return two(Math.floor(mins / 60)) + ':' + two(mins % 60); };
  function show() {
    ticks.style.transform = `translateX(${-(value - MIN) / STEP * PX}px)`;
    out.innerHTML = `${Math.floor(value / 60)}<small>h</small>${two(value % 60)}`;
    hint.textContent = `Lights out 23:30, up at ${clock(23 * 60 + 30 + value)}.`;
    ruler.setAttribute('aria-valuenow', value);
    ruler.setAttribute('aria-valuetext', `${Math.floor(value / 60)} hours ${value % 60} minutes`);
  }
  function set(v) { v = Math.max(MIN, Math.min(MAX, Math.round(v / STEP) * STEP)); if (v !== value) { value = v; navigator.vibrate?.(4); show(); } }
  ruler.addEventListener('pointerdown', (e) => { ruler.setPointerCapture(e.pointerId); dragging = true; startX = e.clientX; startValue = value; ruler.classList.add('dragging'); });
  ruler.addEventListener('pointermove', (e) => { if (dragging) set(startValue - (e.clientX - startX) / PX * STEP); });
  ['pointerup', 'pointercancel'].forEach((n) => ruler.addEventListener(n, () => { dragging = false; ruler.classList.remove('dragging'); }));
  ruler.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); set(value - STEP); } if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); set(value + STEP); } });
  show();
})();
</script>
